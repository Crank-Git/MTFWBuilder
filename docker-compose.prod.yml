# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  mtfwbuilder:
    environment:
      - MTFW_LOG_LEVEL=WARNING
      - MTFW_LOG_JSON=true
      # nginx is the only other container on the backend network, so the app reads X-Forwarded-For from it.
      - MTFW_TRUSTED_PROXIES=172.30.80.0/24
    restart: always
    # Compose appends override sequences to the base, so only !reset removes port 5000.
    ports: !reset []
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: mtfwbuilder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - mtfwbuilder
    restart: always
    networks:
      - backend
      - frontend

networks:
  backend:
    internal: true
    # MTFW_TRUSTED_PROXIES names this subnet. Change both values together.
    ipam:
      config:
        - subnet: 172.30.80.0/24
  frontend:
    external: false
