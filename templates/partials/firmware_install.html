{# The panel of one install. An install that has not ended holds the install progress stream. #}
<div class="card mb-3" id="install-{{ install.install_id }}"{% if not install.ended %} hx-ext="sse" sse-connect="{{ progress_url }}"{% endif %}>
    <div class="card-header">Install of <code>{{ install.version }}</code> ({{ install.channel }})</div>
    <div class="card-body" aria-live="polite"{% if not install.ended %} hx-get="/api/v1/firmware/install/{{ install.install_id }}" hx-trigger="sse:status"{% endif %}>
        {% include "partials/install_state.html" %}
    </div>
</div>
{% if refresh_sources %}
<div id="firmware-source-list" hx-swap-oob="innerHTML">{% include "partials/firmware_sources.html" %}</div>
{% endif %}
