<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} — {% endif %}MTFWBuilder</title>
    <script>
        // This script runs before the stylesheets load, so the page never paints in the wrong theme.
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap-5.3.9.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap-icons-1.13.2/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/htmx-ext-sse-2.2.4.min.js') }}"></script>
</head>
<body>
    <div class="container">
        <div class="app-header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="app-title">
                    <i class="bi bi-gear-fill me-2 text-success"></i>
                    Meshtastic Configuration Generator
                </h1>
                <p class="app-subtitle">Create a custom userPrefs.jsonc file for your Meshtastic device</p>
            </div>
            <nav class="d-flex align-items-center" aria-label="Pages">
                <a href="/" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-hammer me-1"></i>Build
                </a>
                <a href="/profiles" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-collection me-1"></i>Profiles
                </a>
                <a href="/fleets" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-diagram-3 me-1"></i>Fleets
                </a>
                <a href="/admin" class="btn btn-outline-secondary me-2" title="Admin Dashboard" aria-label="Admin dashboard">
                    <i class="bi bi-shield-lock-fill"></i>
                </a>
                <button id="darkModeToggle" class="btn btn-outline-secondary" title="Toggle Light/Dark Mode" aria-label="Toggle dark mode">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </nav>
        </div>
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="{{ url_for('static', path='vendor/bootstrap-5.3.9.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/timezone-data.js') }}"></script>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    <script src="{{ url_for('static', path='js/flash.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
