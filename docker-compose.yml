services:
  mtfwbuilder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtfwbuilder
    ports:
      - "5000:5000"
    volumes:
      # Firmware sources, artifacts, the database and config.yaml.
      - data:/data
      # PlatformIO toolchains, so a new container does not download them again.
      - platformio:/home/app/.platformio
    environment:
      - MTFW_DATA_DIR=/data
      - MTFW_LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  data:
  platformio:

networks:
  default:
    name: mtfwbuilder-network
