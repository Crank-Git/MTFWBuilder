# CI runs the commands that CLAUDE.md documents, so a green check means the
# local commands pass too. Until Epic 4 lands, the install uses pip, not uv.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, format check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile uses Python 3.11. CI uses the same version so the tests
      # run on the interpreter that ships.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check mtfwbuilder/ tests/

      - name: Format check
        run: ruff format --check mtfwbuilder/ tests/

      - name: Tests
        run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image is built to prove the Dockerfile works. It is never pushed.
      - name: Build
        run: docker build --tag mtfwbuilder:ci .
